<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dr Design Technology</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var theme = saved === "light" || saved === "dark"
            ? saved
            : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          if (theme === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://ddpl.in/#website",
            "name": "DDPL",
            "url": "https://ddpl.in/",
            "description": "Dr. Design Technology is a leading provider of comprehensive technology solutions, including ERP, Website & App Development, and Digital Marketing Services.",
            "potentialAction": [
              {
                "@type": "SearchAction",
                "target": "https://ddpl.in/?s={search_term_string}",
                "query-input": "required name=search_term_string"
              }
            ]
          },
          {
            "@type": "WebPage",
            "@id": "https://ddpl.in/#webpage",
            "url": "https://ddpl.in/",
            "name": "Home",
            "isPartOf": { "@id": "https://ddpl.in/#website" },
            "breadcrumb": {
              "@type": "BreadcrumbList",
              "itemListElement": [
                { "@type": "ListItem", "position": 1, "name": "Home" }
              ]
            },
            "inLanguage": "en-US",
            "potentialAction": [
              { "@type": "ReadAction", "target": ["https://ddpl.in/"] }
            ],
            "about": { "@type": "Organization", "@id": "https://ddpl.in/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://ddpl.in/#organization",
            "name": "Dr. Design Technology",
            "description": "Dr. Design Technology is a leading provider of comprehensive technology solutions, including ERP, Website & App Development, and Digital Marketing Services.",
            "url": "https://ddpl.in/",
            "logo": "https://ddpl.in/wp-content/uploads/2024/03/logo.png",
            "sameAs": [
              "https://www.facebook.com/ddpl.in",
              "https://www.instagram.com/drdesigntechnology/",
              "https://www.linkedin.com/company/dr-design-technology-pvt-ltd",
              "https://www.youtube.com/channel/UCHd2qOaV0y4w_4oF03tYj4w",
              "https://twitter.com/DRDESIGNTECH"
            ]
          },
          {
            "@type": "BreadcrumbList",
            "itemListElement": [
              { "@type": "ListItem", "position": 1, "name": "Home" }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
